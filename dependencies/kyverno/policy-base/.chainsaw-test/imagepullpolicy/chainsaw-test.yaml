---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-without-suffix
spec:
  description: |
    pod without suffix
  concurrent: false
  namespace: 'non-matching-pod-imagepullpolicy-enterprise'
  steps:
  - name: given-kyverno-has-permission-on-resources
    try:
    - apply:
        file: ../../../kyverno-rbac.yaml
  - name: given-cluster-policy-is-ready
    try:
    - apply:
        file: ../../reduce-tekton-pr-taskrun-resource-requests.yaml
    - assert:
        file: ../chainsaw-assert-clusterpolicy.yaml
  - name: when-pod-is-created
    try:
    - apply:
        file: ./resources/pod-no-suffix-label.yaml
  - name: then-pod-is-not-mutated
    try:
    - assert:
        file: ./resources/pod-no-suffix-label.yaml
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-with-suffix-no-labels
spec:
  description: |
    pod with suffix, but no labels
  concurrent: false
  namespace: 'non-matching-pod-imagepullpolicy-enterprise'
  steps:
  - name: given-kyverno-has-permission-on-resources
    try:
    - apply:
        file: ../../../kyverno-rbac.yaml
  - name: given-cluster-policy-is-ready
    try:
    - apply:
        file: ../../reduce-tekton-pr-taskrun-resource-requests.yaml
    - assert:
        file: ../chainsaw-assert-clusterpolicy.yaml
  - name: when-pod-is-created
    try:
    - apply:
        file: ./resources/pod-suffix-no-labels.yaml
  - name: then-pod-is-not-mutated
    try:
    - assert:
        file: ./resources/pod-suffix-no-labels.yaml
